<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی خرگوش و مسیر پاکی</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: auto;
        }
        #gameCanvas {
            border: 4px solid #f1c40f;
            border-radius: 10px;
            background: linear-gradient(to bottom, #87CEEB, #e0f6ff);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: none;
        }
        .ui-box {
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            width: 380px;
            margin-bottom: 15px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Tahoma', sans-serif;
            width: 100%;
        }
        button:hover { background-color: #219653; }
        .google-btn { background-color: #db4437; margin-bottom: 10px; }
        .google-btn:hover { background-color: #c53727; }
        .guest-btn { background-color: #7f8c8d; }
        .guest-btn:hover { background-color: #707b7c; }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 90%;
            margin-top: 10px;
            text-align: center;
        }
        #leaderboard {
            margin-top: 15px;
            background: #2c3e50;
            padding: 10px;
            border-radius: 5px;
            max-height: 150px;
            overflow-y: auto;
            text-align: right;
            font-size: 14px;
        }
        .hidden { display: none !important; }
        .user-status {
            font-size: 13px;
            color: #f1c40f;
            margin-bottom: 10px;
        }
    </style>

    <!-- کتابخانه‌های فایربیس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrMw31xVAszqXUvP6AiufOGL_6XdYoaM4",
            authDomain: "myai-bd693.firebaseapp.com",
            projectId: "myai-bd693",
            storageBucket: "myai-bd693.firebasestorage.app",
            messagingSenderId: "305975730704",
            appId: "1:305975730704:web:9771b3873c59f638a06095",
            measurementId: "G-N0VN5C976D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let username = "";

        const loginScreen = document.getElementById('login-screen');
        const usernameScreen = document.getElementById('username-screen');
        const menuScreen = document.getElementById('menu-screen');
        const gameCanvas = document.getElementById('gameCanvas');
        const userStatusEl = document.getElementById('userStatus');
        const logoutBtn = document.getElementById('logoutBtn');

        // ورود با گوگل
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("خطا در ورود با گوگل: " + error.message);
            }
        });

        // بازی به عنوان مهمان
        document.getElementById('guestBtn').addEventListener('click', () => {
            currentUser = null;
            username = "مهمان";
            loginScreen.classList.add('hidden');
            usernameScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            userStatusEl.innerText = "شما به صورت مهمان وارد شده‌اید (رکوردها ثبت نمی‌شوند)";
            logoutBtn.classList.add('hidden');
            loadLeaderboard();
        });

        // خروج از حساب
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });

        // ثبت نام مستعار
        document.getElementById('saveUsernameBtn').addEventListener('click', async () => {
            const inputVal = document.getElementById('usernameInput').value.trim();
            if (!inputVal) {
                alert("لطفاً یک نام معتبر وارد کنید.");
                return;
            }
            username = inputVal;
            await setDoc(doc(db, "users", currentUser.uid), { username: username }, { merge: true });
            usernameScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            userStatusEl.innerText = `کاربر: ${username} (متصل به گوگل)`;
            logoutBtn.classList.remove('hidden');
            loadLeaderboard();
        });

        // وضعیت احراز هویت
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().username) {
                    username = userDoc.data().username;
                    usernameScreen.classList.add('hidden');
                    menuScreen.classList.remove('hidden');
                    userStatusEl.innerText = `کاربر: ${username} (متصل به گوگل)`;
                    logoutBtn.classList.remove('hidden');
                    loadLeaderboard();
                } else {
                    usernameScreen.classList.remove('hidden');
                }
            } else {
                // اگر کاربر لاگین نبود، صفحه لاگین را نشان بده (یا بگذار مهمان بماند)
                if (!username || username === "مهمان") {
                    loginScreen.classList.remove('hidden');
                    usernameScreen.classList.add('hidden');
                    menuScreen.classList.add('hidden');
                }
            }
        });

        // بارگذاری رکوردها
        window.loadLeaderboard = async function() {
            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = "در حال بارگذاری رکوردها...";
            try {
                const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(5));
                const querySnapshot = await getDocs(q);
                let html = "";
                let rank = 1;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    html += `<li>${rank}. <b>${data.username}</b>: ${data.score} امتیاز</li>`;
                    rank++;
                });
                listEl.innerHTML = html || "هنوز رکوردی ثبت نشده است.";
            } catch (e) {
                listEl.innerHTML = "خطا در دریافت رکوردها.";
            }
        }

        // ذخیره امتیاز در فایربیس (فقط برای کاربران لاگین شده)
        window.saveScoreToFirebase = async function(finalScore) {
            if (!currentUser || username === "مهمان") return;
            try {
                const userScoreRef = doc(db, "scores", currentUser.uid);
                const docSnap = await getDoc(userScoreRef);
                
                if (!docSnap.exists() || finalScore > docSnap.data().score) {
                    await setDoc(userScoreRef, {
                        username: username,
                        score: finalScore,
                        uid: currentUser.uid,
                        updatedAt: new Date()
                    });
                }
                loadLeaderboard();
            } catch (e) {
                console.error("خطا در ذخیره امتیاز:", e);
            }
        }
    </script>
</head>
<body>

    <!-- صفحه لاگین -->
    <div id="login-screen" class="ui-box">
        <h2>ورود به بازی خرگوش</h2>
        <p>برای ثبت رکورد در جدول برترین‌ها وارد شوید، یا به عنوان مهمان بازی کنید.</p>
        <button id="googleLoginBtn" class="google-btn">ورود با حساب گوگل</button>
        <button id="guestBtn" class="guest-btn">ورود به عنوان مهمان (بدون ثبت رکورد)</button>
    </div>

    <!-- صفحه انتخاب نام -->
    <div id="username-screen" class="ui-box hidden">
        <h2>انتخاب نام مستعار</h2>
        <p>نامی که می‌خواهید در جدول رکوردها نمایش داده شود را وارد کنید:</p>
        <input type="text" id="usernameInput" placeholder="مثلاً: قهرمان پاکی">
        <br>
        <button id="saveUsernameBtn">تایید و ورود به بازی</button>
    </div>

    <!-- منوی اصلی و جدول رکوردها -->
    <div id="menu-screen" class="ui-box hidden">
        <div id="userStatus" class="user-status"></div>
        <h2>آماده بازی هستید؟</h2>
        <button onclick="startGame()">شروع بازی 🎮</button>
        <button id="logoutBtn" style="background-color: #c0392b; margin-top: 5px;" class="hidden">خروج از حساب / تغییر اکانت</button>
        <h3>🏆 جدول برترین‌ها</h3>
        <ul id="leaderboardList" style="list-style: none; padding: 0;">
            بارگذاری...
        </ul>
    </div>

    <!-- بوم بازی -->
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let gameOver = false;
        let gameRunning = false;

        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            width: 40,
            height: 40,
            speed: 7,
            dx: 0
        };

        const items = [];
        const itemTypes = [
            { type: 'good', text: '📖', name: 'قرآن' },
            { type: 'good', text: '🕋', name: 'نماز' },
            { type: 'bad', text: '😈', name: 'شیطان' }
        ];

        // کنترل با کلیدها (چپ = حرکت به چپ، راست = حرکت به راست)
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                player.dx = -player.speed;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                player.dx = player.speed;
            } else if (gameOver && e.key === ' ') {
                returnToMenu();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!gameRunning) return;
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'a' || e.key === 'd' || e.key === 'A' || e.key === 'D') {
                player.dx = 0;
            }
        });

        function startGame() {
            document.getElementById('menu-screen').classList.add('hidden');
            canvas.style.display = 'block';
            gameRunning = true;
            restartGame();
            gameLoop();
        }

        function returnToMenu() {
            canvas.style.display = 'none';
            document.getElementById('menu-screen').classList.remove('hidden');
            if (typeof loadLeaderboard === 'function') loadLeaderboard();
        }

        function spawnItem() {
            if (!gameRunning || gameOver) return;
            const isGood = Math.random() > 0.35; 
            const selectedType = isGood 
                ? itemTypes[Math.floor(Math.random() * 2)] 
                : itemTypes[2]; 

            items.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                size: 30,
                speed: 2 + Math.random() * 3 + (score / 50),
                ...selectedType
            });
        }

        setInterval(spawnItem, 1000);

        function update() {
            if (!gameRunning || gameOver) return;

            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;

                if (
                    player.x < item.x + item.size &&
                    player.x + player.width > item.x &&
                    player.y < item.y + item.size &&
                    player.y + player.height > item.y
                ) {
                    if (item.type === 'good') {
                        score += 10;
                    } else if (item.type === 'bad') {
                        gameOver = true;
                        gameRunning = false;
                        if (typeof saveScoreToFirebase === 'function') {
                            saveScoreToFirebase(score);
                        }
                    }
                    items.splice(i, 1);
                    continue;
                }

                if (item.y > canvas.height) {
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            ctx.font = '36px Arial';
            ctx.fillText('🐰', player.x, player.y + 32);

            for (const item of items) {
                ctx.font = '28px Arial';
                ctx.fillText(item.text, item.x, item.y);
            }

            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 20px Tahoma';
            ctx.fillText(`امتیاز: ${score}`, 15, 30);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 36px Tahoma';
                ctx.textAlign = 'center';
                ctx.fillText('بازی تمام شد!', canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px Tahoma';
                ctx.fillText(`امتیاز نهایی: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('برای بازگشت به منو و ثبت رکورد کلید Space را بزنید', canvas.width / 2, canvas.height / 2 + 60);
                ctx.textAlign = 'start';
            }
        }

        function restartGame() {
            score = 0;
            items.length = 0;
            player.x = canvas.width / 2 - 20;
            gameOver = false;
            gameRunning = true;
        }

        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
