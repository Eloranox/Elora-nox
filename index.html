<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrMw31xVAszqXUvP6AiufOGL_6XdYoaM4",
    authDomain: "myai-bd693.firebaseapp.com",
    projectId: "myai-bd693",
    storageBucket: "myai-bd693.firebasestorage.app",
    messagingSenderId: "305975730704",
    appId: "1:305975730704:web:9771b3873c59f638a06095",
    measurementId: "G-N0VN5C976D"
  };

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  async function loginGoogle() {
    try {
      const result = await signInWithPopup(auth, provider);

      console.log("ورود موفق:", result.user);
      alert("ورود موفق شد: " + result.user.email);

    } catch (error) {
      console.error("Google Login Error:", error);
      alert(error.code + "\n" + error.message);
    }
  }

  window.loginGoogle = loginGoogle;
</script>

<button onclick="loginGoogle()">
  ورود با Google
</button>
